unit.dp-annihilate-unit.name = Аннигилятор
unit.dp-annihilate-unit.description = Стреляет плазменными и энергетическими снарядами по врагам. Не может двигаться быстро во время стрельбы.
unit.dp-aractid-unit.name = Арактид
unit.dp-aractid-unit.description = Стреляет истощающими снарядами по врагам, ремонтируя себя в процессе. Может переступать через большую часть местности.
unit.dp-aranethys-crux-t6.name = Аранетхис
unit.dp-aranethys-crux-t6.description = паук австралийский.
unit.dp-aranethys-unit.name = Аранетхис
unit.dp-aranethys-unit.description = Стреляет пробивающими лазерами, нефтью и артиллерией по всем врагам поблизости.
unit.dp-daybreak-unit.name = Рассвет
unit.dp-daybreak-unit.description = Затмение. Версия II.
unit.dp-destroy-unit.name = Разрушитель
unit.dp-destroy-unit.description = Стреляет артиллерией по наземным целям. Разгоняет ближайшие единицы.
unit.dp-devastator-unit.name = Опустошитель
unit.dp-dominion-unit.name = Доминион
unit.dp-dominion-unit.description = Стреляет ракетами, пробивающими пулями и огнём по врагам.
unit.dp-eliminate-unit.name = Уничтожитель
unit.dp-eliminate-unit.description = Стреляет лазерным лучом и ракетами по всем врагам поблизости.
unit.dp-empire-crux-t6.name = Империя
unit.dp-empire-crux-t6.description = Осадная машина. Быстро разрушает постройки.
unit.dp-empire-unit.name = Империя
unit.dp-empire-unit.description = Стреляет гигантскими пробивающими энергетическими пулями и минами по всем врагам поблизости.
unit.dp-giga-unit.name = Гига
unit.dp-giga-unit.description = Стреляет ракетами и пробивающими лазерами, ремонтируя союзные постройки и повреждая врагов. Может переносить единицы среднего размера.
unit.dp-incinerate-unit.name = Зажигатель
unit.dp-incinerate-unit.description = Стреляет конусом горящих осколков по всем врагам поблизости.
unit.dp-magnetar-crux-t6.name = Магнетар
unit.dp-midnight-crux-t6.name = Полночь
unit.dp-midnight-crux-t6.description = Уничтожает врагов гарпуном, ракетами и лазерами.
unit.dp-midnight-crux-t6.details = Летающий ужас
unit.dp-midnight-unit.name = Полночь
unit.dp-midnight-unit.description = Стреляет замедляющими гарпунами, массивными лазерами и ракетами по всем врагам поблизости.
unit.dp-midnight-unit.details = Летающий ужас
unit.dp-omega-unit.name = Омега
unit.dp-omega-unit.description = Стреляет лазерными снарядами и медленными самонаводящимися энергетическими шарами, которые повреждают врагов и ремонтируют союзные постройки. Быстро ремонтирует союзные единицы. Подавляет вражеские ремонтирующие постройки. Может переносить большинство наземных единиц.
unit.dp-omni-unit.name = Омни
unit.dp-omni-unit.description = Стреляет лазерными бомбами, которые повреждают врагов и ремонтируют союзные постройки. Может переносить большие наземные единицы.
unit.dp-orion-unit.name = Орион
unit.dp-orion-unit.description = Стреляет лазерами, молниями и лазерными снарядами, которые повреждают врагов и ремонтируют союзные постройки. Ремонтирует союзные единицы.
unit.dp-poseidon-crux-t6.name = Посейдон
unit.dp-poseidon-crux-t6.description = Стреляет многочисленными типами снарядов по всем врагам поблизости.
unit.dp-poseidon-unit.name = Посейдон
unit.dp-poseidon-unit.description = Стреляет многочисленными типами снарядов по всем врагам поблизости.
unit.dp-regent-unit.name = Регент
unit.dp-regent-unit.description = Стреляет пробивающими пулями и струёй огня по всем врагам поблизости.
unit.dp-remove-unit.name = Устранитель
unit.dp-remove-unit.description = Разгоняется во время стрельбы, получая большие накапливающиеся бонусы к скорости движения и стрельбы, но повреждая себя в процессе. Вызывает большой взрыв при уничтожении.
unit.dp-rive-unit.name = Риве
unit.dp-rive-unit.description = Быстрый дрон-камикадзе.
unit.dp-spearhead-unit.name = Авангард
unit.dp-spearhead-unit.description = Стреляет цепными ракетами по врагам. Ускоряется и наносит массивный урон при стрельбе во время движения вперёд.
unit.dp-stryker-unit.name = Страйкер
unit.dp-terminate-unit.name = Терминатор
unit.dp-terminate-unit.description = Совершает рывки на всех врагов поблизости. Перегружает себя, если атакует слишком часто.
unit.dp-terminate-unit.details = нельзя долбиться в стены, если ты летаешь.
unit.dp-tetraphyllus-unit.name = Тетрафиллус
unit.dp-tetraphyllus-unit.description = Стреляет мощными баллистическими ракетами по удалённым вражеским целям.
unit.dp-venomreach-crux-t6.name = Веномрич
unit.dp-venomreach-crux-t6.description = ужас.
unit.dp-venomreach-unit.name = Веномрич
unit.dp-venomreach-unit.description = Стреляет массивным истощающим лазером и разрывными снарядами по всем врагам поблизости.
unit.dp-voidweaver-unit.name = Войдвивер
unit.dp-voidweaver-unit.description = Стреляет разнообразными типами энергетических снарядов по врагам. Обладает генератором сингулярности, подавляющим врагов в зависимости от расстояния до него. Может выстрелить сингулярностью по врагам, после чего ускоряется, но перегружает системы вооружений. После перезагрузки систем вооружений выпускает мощный залп.
unit.dp-vulcan-unit.name = Вулкан
unit.dp-vulcan-unit.description = Стреляет массивным потоком огня по всем врагам поблизости.
unit.dp-zoltraak-crux-t6.name = Зольтраак
unit.dp-zoltraak-crux-t6.description = Уничтожает врагов цепными молниями и перегружает противников поблизости.
block.dp-conquer-turret.name = Турель от Завоевателя
block.dp-conquer-turret.description = Украли. Никому не говорите.
block.dp-laboratory-station.name = Лаборатория
block.dp-workbench-station.name = Верстак
status.dp-irradiated.name = Лучевая болезнь
status.dp-irradiated-orange.name = Лучевая болезнь
status.dp-irradiated-red.name = Лучевая болезнь
unit.dp-obliterate-unit.name = Облитератор
unit.dp-obliterate-unit.description = Стреляет снарядами, дестабилизирующими пространство в точке попадания, и залпами высокотемпературной плазмы по всем врагам поблизости.
status.dp-evaporating.name = Испарение
